name: UI Screenshot & PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'haunted_shell/**'
      - 'scripts/**'
      - '.github/workflows/ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  ui-preview:
    name: Generate Terminal UI Screenshot & Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt rich
          pip install -e .

      - name: Generate Terminal UI Screenshot (SVG) and Preview
        run: |
          python scripts/generate_ui_preview.py

      - name: Upload UI Screenshot Artifact
        uses: actions/upload-artifact@v7
        with:
          name: terminal-ui-screenshot
          path: docs/assets/ui_preview.svg
          retention-days: 14

      - name: Post or Update PR Comment with UI Preview
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const previewPath = 'docs/assets/ui_preview.md';
            if (!fs.existsSync(previewPath)) return;
            
            const body = fs.readFileSync(previewPath, 'utf8');
            const header = '### 🎨 Automated Terminal UI Preview & Screenshot';
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => c.body.includes(header));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
