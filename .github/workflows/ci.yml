name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint and format check (ruff)
        run: |
          ruff check haunted_shell tests
          ruff format --check haunted_shell tests

      - name: Type checking (mypy)
        run: |
          mypy haunted_shell

      - name: Run unit tests with Pytest & Coverage
        run: |
          pytest --cov=haunted_shell --cov-report=term-missing tests/

      - name: CLI smoke tests
        run: |
          haunt --version
          haunt --help
          haunt doctor
          haunt airgap
          haunt persona list
          haunt persona show calavera
          haunt config show
          haunt exorcise
          haunt whisper "rm -rf fake_file.txt"
          haunt --persona calavera whisper "git commit -m 'Initial commit'"
          haunt --persona unix-elder whisper "git push origin main"
          haunt hook zsh
          haunt hook bash
          haunt hook fish
