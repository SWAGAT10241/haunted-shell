name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black
          pip install -e .

      - name: Code style & formatting check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv
          # Formatting check with Black (non-blocking diff preview)
          black --check --diff haunted_shell tests || true

      - name: Run unit tests with Pytest
        run: |
          pytest --cov=haunted_shell --cov-report=term-missing tests/

      - name: CLI smoke tests
        run: |
          haunt --help
          haunt airgap
          haunt whisper "rm -rf fake_file.txt"
          haunt --persona calavera whisper "git commit -m 'Initial commit'"
          haunt --persona unix-elder whisper "git push origin main"
          haunt hook zsh
          haunt hook bash
