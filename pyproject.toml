[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haunted-shell"
version = "1.0.0"
description = "A possessed shell companion powered by local open-weight AI - Hacktoberfest Week 4"
readme = "README.md"
authors = [{ name = "Hacktoberfest Ghost Builder" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
haunt = "haunted_shell.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["haunted_shell*"]
